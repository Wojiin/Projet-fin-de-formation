<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#16a34a">
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="ChirOrg, planification des programmes opératoires et préparation du matériel chirurgical.">
    <title>Connexion | ChirOrg</title>
    <style>
      .app-boot{min-height:100vh;display:grid;place-items:center;background:#f8fafc;color:#14532d;font-family:ui-sans-serif,system-ui,sans-serif}.app-boot__content{text-align:center}.app-boot__brand{margin:0;font-size:1.5rem;font-weight:800}.app-boot__status{margin:.5rem 0 0;color:#475569;font-size:.875rem}
      @media(prefers-color-scheme:dark){.app-boot{background:#030712;color:#86efac}.app-boot__status{color:#94a3b8}}
    </style>
  </head>
  <body>
    <div id="app">
      <div class="app-boot" role="status" aria-live="polite">
        <div class="app-boot__content">
          <p class="app-boot__brand">ChirOrg</p>
          <p class="app-boot__status">Chargement de votre espace</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
