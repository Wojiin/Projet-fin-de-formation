name: chirorg3

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: dev
      DATABASE_URL: mysql://chirorg:chirorg@mysql:3306/Chirorg3?serverVersion=8.4.0&charset=utf8mb4
      JWT_REFRESH_COOKIE_SECURE: "false"
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
      - backend_var:/var/www/html/var
    depends_on:
      mysql:
        condition: service_healthy

  nginx_backend:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/backend.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8080/api
      VITE_ENABLE_DEVTOOLS: "false"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - nginx_backend

  programme_cleanup:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: dev
      DATABASE_URL: mysql://chirorg:chirorg@mysql:3306/Chirorg3?serverVersion=8.4.0&charset=utf8mb4
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
      - backend_var:/var/www/html/var
    command: >
      sh -c "while true; do php bin/console app:programmes:purge-expired --no-interaction; sleep 3600; done"
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: Chirorg3
      MYSQL_USER: chirorg
      MYSQL_PASSWORD: chirorg
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
    external: true
    name: backend_database_data
  backend_vendor:
    external: true
    name: backend_vendor_data
  backend_var:
    external: true
    name: backend_var_data
  frontend_node_modules:
    external: true
    name: backend_frontend_node_modules
