name: chirorg3

services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: dev
      DATABASE_URL: mysql://chirorg:chirorg@database:3306/Chirorg3?serverVersion=8.4.0&charset=utf8mb4
    volumes:
      - ./:/var/www/html
      - vendor_data:/var/www/html/vendor
      - var_data:/var/www/html/var
    depends_on:
      database:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8080/api
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - nginx

  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: Chirorg3
      MYSQL_USER: chirorg
      MYSQL_PASSWORD: chirorg
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - database_data:/var/lib/mysql

volumes:
  database_data:
    external: true
    name: backend_database_data
  vendor_data:
    external: true
    name: backend_vendor_data
  var_data:
    external: true
    name: backend_var_data
  frontend_node_modules:
    external: true
    name: backend_frontend_node_modules
